name: Build PS3 Web-Link PKG

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup PS3 Tools
      uses: ps3dev/setup-ps3dev@master

    - name: Create PKG Directory Structure
      run: |
        # إنشاء المجلد الخامس تلقائياً وتوزيع الملفات بداخل
        mkdir -p pkg/USRDIR
        cp LINK.XML pkg/USRDIR/
        cp package.conf pkg/
        if [ -f "ICON0.PNG" ]; then cp ICON0.PNG pkg/; fi
        
        # إنشاء ملف PARAM.SFO المخصص لفئة TV
        sfo_gen --category WT --title "POARO0" --titleid PR0000001 pkg/PARAM.SFO || true

        # تجميع ملف PKG النهائي
        make_package_npdrm package.conf pkg/ POARO0.pkg

    - name: Upload PKG Artifact
      uses: actions/upload-artifact@v3
      with:
        name: POARO0-PS3-PKG
        path: POARO0.pkg
