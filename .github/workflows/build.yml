name: Build PS3 Web-Link PKG

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps3dev/ps3dev:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build PKG Package
        run: |
          export PS3DEV=/usr/local/ps3dev
          export PSL1GHT=$PS3DEV
          export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin

          mkdir -p pkg/USRDIR

          if [ -f LINK.XML ]; then cp LINK.XML pkg/USRDIR/LINK.XML; fi
          if [ -f link.xml ]; then cp link.xml pkg/USRDIR/LINK.XML; fi
          if [ -f ICON0.PNG ]; then cp ICON0.PNG pkg/ICON0.PNG; fi
          if [ -f icon0.png ]; then cp icon0.png pkg/ICON0.PNG; fi

          if [ -f package.conf ]; then
            cp package.conf pkg/package.conf
          else
            echo "ContentID = UP0001-PR0000001_00-0000000000000000" > pkg/package.conf
            echo "K_LICENSEE = 0x00000000000000000000000000000000" >> pkg/package.conf
            echo "DRM_Type = Free" >> pkg/package.conf
            echo "Content_Type = GameData" >> pkg/package.conf
            echo "PackageVersion = 01.00" >> pkg/package.conf
          fi

          python3 -c "import struct; h=struct.pack('<4s4sIII', b'\x00PSF', b'\x01\x01\x00\x00', 68, 92, 3); e0=struct.pack('<HHIII', 0, 0x0204, 3, 4, 0); e1=struct.pack('<HHIII', 9, 0x0204, 7, 128, 4); e2=struct.pack('<HHIII', 15, 0x0204, 10, 16, 132); keys=b'CATEGORY\x00TITLE\x00TITLE_ID\x00'; d0=b'HG\x00\x00'; d1=b'POARDO\x00'+b'\x00'*121; d2=b'PR0000001\x00'+b'\x00'*6; open('pkg/PARAM.SFO', 'wb').write(h+e0+e1+e2+keys+d0+d1+d2)"

          if [ ! -f pkg/USRDIR/EBOOT.BIN ]; then
            touch pkg/USRDIR/EBOOT.BIN
          fi

          make_package_npdrm pkg/package.conf pkg/

      - name: Upload PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: POARDO-PS3-PKG
          path: "*.pkg"
